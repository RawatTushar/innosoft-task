services:
   nginx:
     image: nginx:latest
     ports:
       - "80:80"
     depends_on:
       - app
     volumes:
       - ./nginx/nginx.conf:/etc/nginx/nginx.conf
     networks:
       - proxy_net

   app:
     build: .
     expose:
       - "8080"
     environment:
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_NAME: ${DB_NAME}
     networks:
       - proxy_net
       - backend_net
    
   db:
      image: postgres:16
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      expose:
        - "5432"
      volumes:
        - db_data:/var/lib/postgresql/data
      networks:
        - backend_net

volumes:
  db_data:

networks:
  proxy_net:
  backend_net:
    